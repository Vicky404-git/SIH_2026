<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audit Logs — Sovereign AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/audit-logs.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <main id="app-root" class="page">
    <header class="page-head">
      <h1>Audit Logs</h1>
      <p>Immutable activity across users, agents and resources.</p>
    </header>
    <div class="toolbar">
      <input class="search-input" id="audit-q" type="search" placeholder="Search actions, resources, agents" aria-label="Search audit logs">
      <select id="audit-st" aria-label="Status filter">
        <option value="all">All statuses</option>
        <option value="SUCCESS">Success</option>
        <option value="BLOCKED">Blocked</option>
      </select>
    </div>
    <div class="table-wrap">
      <table class="data">
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>User</th>
            <th>Action</th>
            <th>Agent</th>
            <th>Resource</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="audit-body"></tbody>
      </table>
    </div>
  </main>
  <script src="js/mock-api.js"></script>
  <script src="js/session.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/audit-logs.js"></script>
</body>
</html>
