<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documents — Sovereign AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/documents.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <main id="app-root" class="page">
    <header class="page-head">
      <h1>Document Intelligence</h1>
      <p>Ingest, index and govern technical files on-premise.</p>
    </header>
    <div class="doc-drop" id="doc-drop">Drop PDF, DOC, DOCX, PNG or JPG files to upload and index.</div>
    <div class="toolbar">
      <button type="button" class="btn btn-primary" id="doc-upload">Upload document</button>
      <input class="search-input" id="doc-search" type="search" placeholder="Search documents" aria-label="Search documents">
      <select id="doc-filter" aria-label="Filter by status">
        <option value="all">All statuses</option>
        <option value="Indexed">Indexed</option>
        <option value="Processing">Processing</option>
        <option value="Failed">Failed</option>
      </select>
    </div>
    <div class="table-wrap">
      <table class="data">
        <thead>
          <tr><th>Document</th><th>Type</th><th>Status</th><th>Uploaded</th><th>Actions</th></tr>
        </thead>
        <tbody id="doc-body"></tbody>
      </table>
    </div>
  </main>
  <script src="js/mock-api.js"></script>
  <script src="js/session.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/documents.js"></script>
</body>
</html>
