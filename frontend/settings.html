<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings — Sovereign AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <main id="app-root" class="page">
    <header class="page-head">
      <h1>Settings</h1>
      <p>Workstation preferences. Authorization remains on the server.</p>
    </header>
    <div class="settings-grid">
      <section class="card">
        <h2>Profile</h2>
        <div class="field"><label for="set-name">Name</label><input id="set-name"></div>
        <div class="field" style="margin-top:10px"><label for="set-user">Username</label><input id="set-user"></div>
        <div class="field" style="margin-top:10px"><label for="set-role">Role</label><input id="set-role" readonly></div>
      </section>
      <section class="card">
        <h2>Workspace</h2>
        <div class="field"><label for="def-kb">Default Knowledge Base</label>
          <select id="def-kb">
            <option>Maintenance Manuals</option>
            <option>Equipment Specifications</option>
            <option>Safety Procedures</option>
          </select>
        </div>
        <div class="field" style="margin-top:10px"><label for="def-model">Default Model</label>
          <select id="def-model">
            <option>Open-weight Multimodal Model</option>
          </select>
        </div>
      </section>
      <section class="card">
        <h2>Security</h2>
        <div class="field"><label for="timeout">Session timeout</label>
          <select id="timeout">
            <option>15 minutes</option>
            <option selected>30 minutes</option>
            <option>1 hour</option>
          </select>
        </div>
        <p class="metric-sub" style="margin-top:10px">Authentication is local / directory-backed. No cloud IdP in air-gapped mode.</p>
      </section>
      <section class="card">
        <h2>Appearance</h2>
        <div class="field"><label for="theme">Theme</label>
          <select id="theme">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </div>
        <label class="toggle"><input type="checkbox" id="motion"> Reduced motion</label>
      </section>
      <section class="card span-2">
        <h2>Session</h2>
        <p>Remove conversation history, uploads and temporary agent runs for this session.</p>
        <button type="button" class="btn btn-danger" id="set-del">Delete Everything From This Session</button>
      </section>
    </div>
    <p style="margin-top:16px"><button type="button" class="btn btn-primary" id="save-set">Save settings</button></p>
  </main>
  <script src="js/mock-api.js"></script>
  <script src="js/session.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
