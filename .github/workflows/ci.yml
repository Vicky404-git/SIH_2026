name: CI

on:
  push:
    branches: [ "feat/streamlit-frontend", "feat/rag-foundation", "master", "main" ]
  pull_request:
    branches: [ "feat/streamlit-frontend", "feat/rag-foundation", "master", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --all-extras

    - name: Run test suite
      run: uv run python debug.py
